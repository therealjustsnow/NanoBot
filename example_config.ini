; NanoBot configuration.
; Copy this file to config.ini and fill in at least `token`.
; Keys left blank (or missing) fall back to their built-in default.
;
; Edit with any text editor, or from Discord via DM:
;   !config show                     -- list every key (secrets are masked)
;   !config get <section>.<key>      -- read one value
;   !config set <section>.<key> <v>  -- write one value
;   !reloadconfig                    -- reload without restarting the bot

[bot]
; Bot token from the Discord Developer Portal.
token = YOUR_BOT_TOKEN_HERE

; Passphrase that encrypts both SQLite databases at rest via SQLCipher.
; Blank = no encryption. Requires `pip install sqlcipher3-binary`. The
; NANOBOT_DB_KEY environment variable overrides this value. An existing
; unencrypted database is encrypted automatically on the next start (the
; plaintext copy is kept as *.plain.bak until you delete it).
; WARNING: there is no key recovery — losing the key loses the data.
db_encryption_key =

; Default command prefix (max 5 chars, no spaces).
default_prefix = n!

; Discord user ID of the bot owner. Leave blank to use the application owner.
owner_id =

; Discord channel ID where Python RuntimeWarnings and unhandled asyncio errors
; are posted as embeds. Leave blank to disable Discord error reporting.
error_channel_id =

; Manual idle presence text (also settable live via !status). When blank the
; bot auto-rotates "Listening to /help | /<command>", reshuffling hourly.
idle_status_message =

; Port for a plain-HTTP health-check endpoint (GET /health) for containers and
; orchestrators. Returns 200 once the bot is ready, 503 while still starting.
; 0 disables it (default). Example: health_check_port = 8080
; You may set this to the SAME value as vote_webhook_port — the health route and
; the vote webhook then share one listener (handy when you only have one
; inbound port, e.g. a single game-panel allocation).
health_check_port = 0
; Bind address for the health endpoint. 0.0.0.0 = all interfaces (needed for
; container orchestrators / game panels); 127.0.0.1 = host-local only. The
; payload (guild count, latency) is unauthenticated, so lock it down if the port
; is reachable.
health_check_host = 0.0.0.0

[logging]
; DEBUG / INFO / WARNING / ERROR / CRITICAL
log_level = INFO

; true = log every raw HTTP request (very noisy).
log_http = false

; true = also write structured command-lifecycle events (start/ok/error with
; timings and a correlation id) to logs/events.jsonl, one JSON object per line.
; The human-readable logs/nanobot.log is unaffected. Default: true.
log_events_jsonl = true

; Log any SQLite query that takes longer than this many milliseconds (with its
; duration and a trimmed SQL snippet), so a slow/contended database surfaces in
; the logs instead of being guessed at. 0 disables it (default) with zero added
; overhead. A starting point on a busy bot: 200.
db_slow_query_ms = 0

[votes]
; top.gg v1 API token (used for stat posting and commands sync).
topgg_v1_token =

; discordbotlist.com bot token.
dbl_token =

; discord.bots.gg bot token.
discordbotsgg_token =

; Local port the vote webhook listens on. May be set to the SAME value as
; health_check_port to share one listener (e.g. a single panel allocation that
; serves both /webhook/* and /health).
vote_webhook_port = 5000

; Bind address for the vote webhook. 0.0.0.0 = all interfaces (default);
; 127.0.0.1 = host-local only, e.g. when a reverse proxy forwards to it.
vote_webhook_host = 0.0.0.0

; Shared secret used by bot lists to authenticate webhooks.
vote_webhook_secret =

; Comma-separated IPs or CIDR ranges allowed to POST webhooks.
; e.g. 167.114.156.0/24,192.168.1.1
; Leave blank to allow all IPs (default, existing behaviour).
webhook_allowed_ips =

[groq]
; Groq API key (free at console.groq.com). Powers /eli5 and WYR generation.
; The GROQ_API_KEY environment variable takes priority if set.
groq_api_key =

[scraper]
; FML pages fetched per daily scrape (~5-10 stories each).
fml_pages_per_scrape = 500

; Would-You-Rather API requests per rating per daily scrape.
wyr_requests_per_scrape = 500

; nekos.best images fetched per endpoint per daily scrape.
nekos_per_endpoint = 400

; Nekosia images fetched per tag per daily scrape.
nekosia_per_tag = 400

; Age (seconds) before a cached URL is rechecked with HEAD. 604800 = 7 days.
revalidate_age = 604800

; Max URLs to HEAD-check per 6-hour revalidation cycle.
revalidate_batch = 1000

; System prompt used when Groq generates fresh WYR questions daily.
groq_wyr_system = You generate Would You Rather questions for a Discord bot. Return ONLY a JSON array of strings. Each string must start with "Would you rather" and contain exactly two options separated by " or ". End each with a question mark. Make them fun, creative, and varied -- mix silly, deep, gross, impossible, and everyday scenarios. No numbered lists, no markdown, no explanation. Just the JSON array.

[music]
; Path to a yt-dlp cookies.txt file. Many sources (age-restricted videos,
; region locks, or "Sign in to confirm you're not a bot" rate limits) require
; cookies exported from a logged-in browser. Leave blank to run without cookies.
; Export with a browser extension like "Get cookies.txt LOCALLY".
music_cookie_file =

; Default playback volume as a percentage (0-200). 50 is a safe default.
music_default_volume = 50

; Seconds before leaving after everyone leaves (channel empties — playback pauses
; immediately; if someone returns within this window playback resumes automatically)
; or after the queue empties with no one adding tracks. Values below 30 clamped to 30.
music_idle_timeout = 180

; Percent of voice-channel listeners who must vote to skip a track (0-100).
; The track requester and members with Manage Server can always force-skip.
music_skip_ratio = 50

; Maximum number of tracks allowed in a single server's queue.
music_max_queue = 500

; Path to a deno, node, or bun binary for yt-dlp's JavaScript interpreter.
; Leave blank to auto-detect from PATH and common install locations.
; Example: music_js_runtime_path = /home/user/.deno/bin/deno
music_js_runtime_path =

; Send audio to Discord as Opus (true) or PCM (false).
; Opus (default) is cheaper when the source is already Opus — its packets are
; copied straight through with no re-encode — and matches the voice channel's
; bitrate for better quality. PCM decodes every track and lets discord.py do
; the Opus encoding (fixed ~128 kbps): it costs more CPU, but volume changes
; apply instantly without re-streaming the track. Default: true.
music_use_opus = true

; Save the playback queue to disk so it survives a bot restart. When on, the
; bot reconnects to its last voice channel on startup and resumes the queue
; (the current track restarts from the beginning, the rest of the queue is
; intact). Default: true.
music_persist_queue = true

; Download the next queued track to a temporary file while the current one
; plays, so the switch between tracks is instant. Uses extra disk and bandwidth
; for the lookahead. Files are deleted after they play. Live streams are never
; downloaded (they'd never finish) — they just stream normally. Default: true.
music_predownload = true

; Self-deafen when joining a voice channel. The bot never needs to hear audio,
; so deafening saves a little server bandwidth and reassures members. Default: true.
music_self_deafen = true

; Default playback speed (0.5-3.0). 1.0 is normal. Default: 1.0.
music_default_speed = 1.0

; Search service used for non-URL queries: ytsearch (YouTube), ytmsearch
; (YouTube Music), or scsearch (SoundCloud). Default: ytsearch.
music_search_service = ytsearch

; Custom presence text shown while a track plays. Use {title} for the song
; title. Leave blank to show just the song title. While playing, YouTube/Twitch
; tracks use a "Streaming" status (Discord shows a clickable Watch button); the
; bot switches back to "Watching over the server" when nothing is playing.
; Note: Discord bot presence is account-global (no per-guild activity exists),
; so with several servers playing at once it shows whichever started first.
; Example: {title}
music_status_message =

; HTTP/HTTPS proxy URL for yt-dlp (helps with region locks / rate limits).
; Leave blank for none. Example: http://user:pass@host:port
music_proxy =

; Static User-Agent header for yt-dlp. Leave blank for the default.
music_user_agent =

; Local IP address yt-dlp binds outbound requests to. Default: 0.0.0.0
music_source_address = 0.0.0.0

; Seconds to sleep between yt-dlp HTTP requests (decimals OK). Paces the bot so
; a proxy IP gets flagged/rate-limited more slowly; adds a little start latency.
; 0 = off. Try 1 if a residential proxy IP keeps getting 403'd. Default: 0.
music_request_throttle = 0

; Force a yt-dlp YouTube player client (comma-separated for fallbacks). With
; cookies yt-dlp may pick the "tv" client, which serves HLS/m3u8 that 403s
; through some proxies; a progressive client streams cleanly instead. Common
; values: web_safari, mweb, android_vr, web. Blank = let yt-dlp choose. Default: blank.
music_player_client =

; Base URL of a running bgutil PO-token provider. YouTube gates good formats
; behind a GVS PO token; without it yt-dlp returns "Requested format is not
; available" / HTTP 403. Install the bgutil-ytdlp-pot-provider plugin (in
; requirements.txt) AND run its provider server (Docker, or Node/Deno). The
; plugin auto-finds a provider at http://127.0.0.1:4416 — only set this for a
; non-default host/port. Blank = auto/disabled. Default: blank.
music_pot_provider_url =

; When autoplay is filling a quiet queue and a user queues a real song, skip
; the autoplay track immediately so the request plays. Default: true.
music_autoplay_autoskip = true

; Keep downloaded audio in data/music_cache/ for instant replays instead of
; deleting it after each track. Uses disk; pair with the cache limits below.
; Default: false.
music_save_videos = false

; Max audio cache size in MB when music_save_videos is on (0 = unlimited).
music_cache_max_mb = 0

; Delete cached audio older than this many days (0 = never). Default: 0.
music_cache_max_age_days = 0

; Seconds to back off after YouTube rate-limits the bot (HTTP 429). Default: 600.
music_ratelimit_cooldown = 600

; Leave all voice channels when YouTube rate-limits the bot. Default: false.
music_ratelimit_leave = false

; Automatically remove autoplaylist entries that fail to play. Default: true.
music_apl_prune_on_error = true

; Save a per-server played-track history (for the history command). Default: true.
music_save_history = true

; Fill a missing artist via Apple's free, keyless iTunes Search API. Default: true.
music_metadata_lookup = true

; SponsorBlock: skip non-music / sponsor segments using the crowd-sourced
; SponsorBlock database. When on, a track is downloaded first and the matched
; segments are cut out with FFmpeg before it plays (live streams can't be cut,
; so they stream in full). This adds a little start-up latency and forces a
; download even when music_predownload is off. Heads-up: if you queue something
; that ISN'T a plain song (e.g. an official music video with intro skits you
; actually want), the "music_offtopic" category may trim parts you wanted to
; keep. Default: false.
music_sponsorblock = false

; Which SponsorBlock categories to remove (comma-separated). Only used when
; music_sponsorblock is on. "music_offtopic" is the non-music section of a music
; video — the usual choice. Valid: sponsor, intro, outro, selfpromo, preview,
; filler, interaction, music_offtopic, poi_highlight. Default: music_offtopic.
music_sponsorblock_categories = music_offtopic
