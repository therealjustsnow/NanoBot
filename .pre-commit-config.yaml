# Pre-commit hooks for NanoBot.
#
#   pip install pre-commit
#   pre-commit install          # run automatically on every `git commit`
#   pre-commit run --all-files  # run once over the whole tree
#
# Mirrors what CI enforces (Black) plus a Ruff lint pass (see ruff.toml), so
# defects are caught before they reach a push instead of after.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
